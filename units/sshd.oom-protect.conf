# Prioridade máxima contra o kernel OOM killer: sshd é a única porta de
# acesso remoto (tailscale ssh). Se o kernel OOM matar o sshd, o nó fica
# inacessível e o operador não consegue recuperar sem console físico.
# Contexto: OOM de host em system.slice já ocorreu (boot 2026-08-19,
# journal corrompido — a vítima não foi registrada).
[Service]
OOMScoreAdjust=-900