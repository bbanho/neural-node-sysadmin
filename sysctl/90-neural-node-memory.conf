# neural-node (8GB RAM, 6 containers + GPU): deixa o kernel usar o swap zram
# (comprimido em RAM, sem tocar disco) ANTES do kernel OOM killer agir.
# OOMs de host matam processos de system.slice aleatoriamente (sshd, docker,
# journald...) — cada morte silenciosa dessas derrubou o nó neste mês.
#
# swappiness alto + page-cluster 0 = o zram absorve os picos de memória
# (ingest + ollama + postgres catch-up) em vez de o OOM matar um processo vital.
vm.swappiness = 60
vm.page-cluster = 0